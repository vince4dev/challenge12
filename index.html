<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <!-- Style CSS -->
    <link rel="stylesheet" href="./assets/css/style.css" />

    <!-- Javascript -->
    <script src="./assets/js/calcul.js" defer></script>

    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <!-- Main title, visible only to search engines & screen readers -->
    <h1 class="sr-only">SPLITTER</h1>
    <main>
      <!-- TITLE IMAGE -->
      <img
        class="img-title"
        src="./assets/images/logo.svg"
        alt="Display application title SPLITTER"
      />

      <!-- MAIN -->
      <article class="container">
        <section class="info">
          <div class="info__bill">
            <div class="info__title">
              <h2>Bill</h2>
              <span id="bill-error" class="error-msg" role="alert"></span>
            </div>
            <input
              id="bill-amount"
              class="numeric-only"
              inputmode="numeric"
              type="text"
              placeholder="0"
              aria-label="field to enter the bill"
              aria-describedby="bill-error"
            />
          </div>
          <div class="info__tip">
            <h2>Select Tip %</h2>
            <div class="info__btn">
              <button
                class="btn__percent btn"
                aria-checked="false"
                data-percent="5"
              >
                5%
              </button>
              <button
                class="btn__percent btn"
                aria-checked="false"
                data-percent="10"
              >
                10%
              </button>
              <button
                class="btn__percent btn"
                aria-checked="false"
                data-percent="15"
              >
                15%
              </button>
              <button
                class="btn__percent btn"
                aria-checked="false"
                data-percent="25"
              >
                25%
              </button>
              <button
                class="btn__percent btn"
                aria-checked="false"
                data-percent="50"
              >
                50%
              </button>
              <input
                id="tip-custom"
                class="numeric-only"
                inputmode="numeric"
                type="text"
                placeholder="Custom"
                aria-label="field to enter the custom percent"
              />
            </div>
          </div>
          <div class="info__people">
            <div class="info__title">
              <h2>Number of People</h2>
              <span id="people-error" class="error-msg" role="alert"></span>
            </div>
            <input
              id="people-nbr"
              class="numeric-only"
              inputmode="numeric"
              type="text"
              placeholder="0"
              aria-label="field to enter the number of people"
              aria-describedby="people-error"
            />
          </div>
        </section>

        <section class="results">
          <div class="result__text">
            <div class="result">
              <div class="result__field">
                <h2>Tip Amount</h2>
                <span>/ person</span>
              </div>
              <p id="tip-amount" class="result__sum">$0.00</p>
            </div>
            <div class="result">
              <div class="result__field">
                <h2>Total</h2>
                <span>/ person</span>
              </div>
              <p id="total-amount" class="result__sum">$0.00</p>
            </div>
          </div>
          <button class="btn__reset btn" disabled>RESET</button>
        </section>
      </article>
    </main>
  </body>
</html>
