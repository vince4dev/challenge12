<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <!-- Style CSS -->
    <link rel="stylesheet" href="./assets/css/style.css" />

    <!-- Javascript -->
    <script src="./assets/js/calcul.js"></script>

    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <main>
      <!-- TITLE IMAGE -->
      <img class="img-title" src="./assets/images/logo.svg" alt="" />

      <!-- MAIN -->
      <article class="container">
        <section class="info">
          <div class="info__bill">
            <h2>Bill</h2>
            <input
              type="text"
              placeholder="0"
              aria-label="field to enter the addition"
            />
          </div>
          <div class="info__tip">
            <h2>Select Tip %</h2>
            <div class="info__btn">
              <button class="btn">5%</button>
              <button class="btn">10%</button>
              <button class="btn">15%</button>
              <button class="btn">25%</button>
              <button class="btn">50%</button>
              <input
                id="tip-custom"
                class="btn__custom"
                type="text"
                placeholder="Custom"
              />
            </div>
          </div>
          <div class="info__people">
            <h2>Number of People</h2>
            <input type="text" placeholder="0" />
          </div>
        </section>
        <section class="result">
          <div class="result__tip">
            <h2>
              Tip Amount <br />
              <span>/ person</span>
            </h2>
            <p class="result__tip-sum">$0.00</p>
          </div>
          <div class="result__total">
            <h2>
              Total <br />
              <span>/ person</span>
            </h2>
            <p class="result__total-sum">$0.00</p>
          </div>
          <button class="btn">RESET</button>
        </section>
      </article>
    </main>
  </body>
</html>
